spring.application.name=Turfly
spring.config.import=optional:file:./.env[.properties]
spring.mongodb.database=turfly
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/turfly}
server.port=${PORT:${SERVER_PORT:9091}}
server.address=0.0.0.0

# Spring Boot reads the standard Spring Data names internally.
spring.data.mongodb.database=${spring.mongodb.database}
spring.data.mongodb.uri=${spring.mongodb.uri}
spring.data.mongodb.auto-index-creation=true

# JWT
app.jwt.secret=${JWT_SECRET:turfly-development-secret-key-change-this-before-production-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Public website values
app.frontend-url=${FRONTEND_URL:http://localhost:9091}
app.contact.phone=013089557984
app.contact.email=sifatmazib625@gmail.com
app.contact.address=Niketon, Dhaka

# Local administrator. Override these values in every deployed environment.
app.admin.name=${ADMIN_NAME:Turfly Admin}
app.admin.email=${ADMIN_EMAIL:sifatmazib625@gmail.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}

# Password-reset email. In local mode the reset link is logged instead of sent.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.provider=${MAIL_PROVIDER:auto}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# Brevo transactional email over HTTPS (works on Render Free, unlike SMTP).
app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.sender-email=${BREVO_SENDER_EMAIL:${app.contact.email}}
app.brevo.sender-name=${BREVO_SENDER_NAME:Turfly}

# SSLCommerz hosted checkout. Blank credentials keep a safe local demo checkout available.
app.sslcommerz.store-id=${SSLCOMMERZ_STORE_ID:turfl6aca90cfafa61}
app.sslcommerz.store-password=${SSLCOMMERZ_STORE_PASSWORD:}
app.sslcommerz.sandbox=${SSLCOMMERZ_SANDBOX:true}
app.sslcommerz.demo-enabled=${SSLCOMMERZ_DEMO_ENABLED:false}
app.backend-url=${BACKEND_URL:http://localhost:9091}

# Spring AI is disabled until an API key is supplied.
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4.1-mini}
app.ai.enabled=${AI_ENABLED:false}

# Cache frequently requested public data for five minutes.
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=5m

# Keep local frontend bundles fresh while developing from IntelliJ.
spring.web.resources.cache.period=0

spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB
app.upload-dir=${UPLOAD_DIR:uploads}
server.error.include-message=never
